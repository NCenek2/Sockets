<div class="join-room">
  <input
    id="room"
    name="room"
    [value]="room()"
    (input)="room.set($any($event.target).value)"
    class="w-25"
  />
  <button
    type="submit"
    class="btn btn-outline-dark"
    [disabled]="!canJoin()"
    (click)="joinRoom()"
  >
    Join
  </button>
</div>
